# build.cfg - per-project build configuration, read by build.bat.
# Format: KEY=VALUE, one per line. A '#' at column 0 is a whole-line comment.
# Do NOT put an inline comment after a value - it becomes part of the value.
# Values may contain spaces. Scaffolded into <repo>\build support\ next to the .vipb.
#
# build.bat uses this file when no config is named on its command line. A repo
# that ships more than one product gives each its own <name>.cfg in this same
# folder and picks one per run:  build.bat "<repo root>" release <name>

# What to build:
BUILD_VIP=true
BUILD_INSTALLER=true

# Build-spec names in the .lvproj (only used when BUILD_INSTALLER=true).
# Convention: "<Product> Application" / "<Product> Installer".
APP_SPEC=Multichannel Lock-In (x64) Application
INST_SPEC=Multichannel Lock-In (x64) Installer

# Run the git release step (commit/merge/tag/push + GitHub release)?
# (Independent of the build-number bump: vipBuild bumps it when BUILD_VIP=true,
# otherwise the script bumps it when BUILD_VIP=false. The bump runs before the
# release, so a release commit carries it; with no release it is left uncommitted.)
DO_RELEASE=true

# Prepended to the git tag and the GitHub release name (TAG_PREFIX + version).
# Leave it empty for a bare version tag - that is what a single-product repo
# wants. Set it, e.g. TAG_PREFIX=my-product/, when one repo releases several
# products whose tags would otherwise collide.
# Careful: avoid '/' in the prefix if the product ships the SelfUpdate class.
# SelfUpdate recovers the version by taking the last path component of the
# releases/latest redirect and re-requesting releases/tag/<that>, so a slash
# in the tag makes that round-trip 404.
TAG_PREFIX=

# Optional overrides - uncomment to use.
# LVVER / LVBIT default to the .vipb's Package_LabVIEW_Version:
# LVVER=2019
# LVBIT=64
# VIPB=MyPackage.vipb
# LVPROJ=my-repo.lvproj
# APP_NAME=Patrick Builder
# PUBLISHER=Levylab
